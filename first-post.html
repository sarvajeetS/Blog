<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello, world (again) — dashper's log</title>
<style>
  :root {
    --text: #e8e8e6;
    --bg: #0d0d0d;
    --bg-raised: #151515;
    --link: #ffffff;
    --visited: #9a9a9a;
    --rule: #262626;
    --meta: #6b6b6b;
  }
  * { box-sizing: border-box; }
  body {
    max-width: 700px;
    margin: 0 auto;
    padding: 50px 20px 80px;
    background: var(--bg);
    color: var(--text);
    font-family: "JetBrains Mono", "Courier New", monospace;
    font-size: 15.5px;
    line-height: 1.7;
  }
  nav {
    margin-bottom: 40px;
    font-size: 0.82em;
  }
  nav a {
    color: var(--meta);
    text-decoration: none;
  }
  nav a:hover { color: var(--text); }

  h1.title {
    font-size: 1.4em;
    margin: 0 0 8px 0;
    font-weight: 600;
  }
  .post-meta {
    font-size: 0.72em;
    color: var(--meta);
    margin-bottom: 28px;
    letter-spacing: 0.5px;
  }
  p {
    color: #b8b8b6;
    font-size: 0.95em;
    line-height: 1.7;
    margin: 0 0 16px 0;
  }
  a { color: var(--link); }
  a:visited { color: var(--visited); }

  footer {
    margin-top: 50px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    font-size: 0.72em;
    color: var(--meta);
  }
</style>
</head>
<body>

<nav>
  <a href="../index.html">&larr; back</a>
</nav>

<h1 class="title">Hello, world (again)</h1>
<div class="post-meta">2026-07-01</div>

<p>
  First post. No CMS, no framework, no build step — just HTML I write by hand
  and push to GitHub Pages. That's the whole system. More coming when there's
  something worth saying.
</p>

<footer>
  built with plain html — no js, no tracking, no cms
</footer>

</body>
</html>
