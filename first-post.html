<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello, world (again) — dashper's log</title>
<style>
  :root {
    --text: #e8e8e6;
    --bg: #0d0d0d;
    --bg-raised: #151515;
    --link: #ffffff;
    --visited: #9a9a9a;
    --rule: #262626;
    --meta: #6b6b6b;
  }
  * { box-sizing: border-box; }
  body {
    max-width: 700px;
    margin: 0 auto;
    padding: 50px 20px 80px;
    background: var(--bg);
    color: var(--text);
    font-family: "JetBrains Mono", "Courier New", monospace;
    font-size: 15.5px;
    line-height: 1.7;
  }
  nav {
    margin-bottom: 40px;
    font-size: 0.82em;
  }
  nav a {
    color: var(--meta);
    text-decoration: none;
  }
  nav a:hover { color: var(--text); }

  h1.title {
    font-size: 1.4em;
    margin: 0 0 8px 0;
    font-weight: 600;
  }
  .post-meta {
    font-size: 0.72em;
    color: var(--meta);
    margin-bottom: 28px;
    letter-spacing: 0.5px;
  }
  p {
    color: #b8b8b6;
    font-size: 0.95em;
    line-height: 1.7;
    margin: 0 0 16px 0;
  }
  a { color: var(--link); }
  a:visited { color: var(--visited); }

  footer {
    margin-top: 50px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    font-size: 0.72em;
    color: var(--meta);
  }
  form {
    margin-bottom: 30px;
    padding: 16px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--bg-raised);
  }
  input, textarea, button {
    width: 100%;
    margin-bottom: 10px;
    padding: 10px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
  }
  button {
    cursor: pointer;
    background: white;
    color: black;
  }
</style>
</head>
<body>

<nav>
  <a href="../index.html">&larr; back</a>
</nav>

<form id="postForm">
  <input type="text" id="titleInput" placeholder="Post title" required>
  <input type="date" id="dateInput" required>
  <textarea id="contentInput" rows="5" placeholder="Write your post..." required></textarea>
  <button type="submit">Post</button>
</form>

<div id="posts"></div>

<footer>
  built with plain html — no js, no tracking, no cms
</footer>

<script>
  function createPost(title, date, content) {
    const posts = document.getElementById('posts');
    const article = document.createElement('article');

    article.innerHTML = `
      <h1 class="title">${title}</h1>
      <div class="post-meta">${date}</div>
      <p>${content}</p>
    `;

    posts.appendChild(article);
  }

  document.getElementById('postForm').addEventListener('submit', function (event) {
    event.preventDefault();

    const title = document.getElementById('titleInput').value;
    const date = document.getElementById('dateInput').value;
    const content = document.getElementById('contentInput').value;

    createPost(title, date, content);
    this.reset();
  });

  createPost(
    'Hello, world (again)',
    '2026-07-01',
    'First post. No CMS, no framework, no build step — just HTML I write by hand and push to GitHub Pages. That\'s the whole system. More coming when there\'s something worth saying.'
  );
</script>

</body>
</html>
